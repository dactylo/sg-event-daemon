# ==========================================================
# Build System
# ==========================================================
[build-system]
build-backend = "hatchling.build"
requires = [ "editables~=0.3", "hatch-fancy-pypi-readme>=25.1", "hatchling>=1.27" ]

# ==========================================================
# Project Metadata
# ==========================================================
[project]
name = "sg-event-daemon"
version = "0.1.0"
description = "Event daemon for Autodesk Flow Production Tracking"
keywords = [ "daemon", "events", "flow-production-tracking", "shotgrid", "shotgun" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
optional-dependencies.sg-python-api = [
  "sg-python-api>=0.1,<0.2",
]
optional-dependencies.sg-python-api-async = [
  "sg-python-api[async]>=0.1,<0.2",
]
optional-dependencies.shotgun-api3 = [
  "shotgun-api3>=3.10,<4",
]
urls.Documentation = "https://github.com/dactylo/sg-event-daemon/tree/main/docs"
urls.Homepage = "https://github.com/dactylo/sg-event-daemon"
urls.Issues = "https://github.com/dactylo/sg-event-daemon/issues"
urls.Repository = "https://github.com/dactylo/sg-event-daemon"
scripts.sg-event-daemon = "sg_event_daemon._cli:main"

[dependency-groups]
dev = [
  "mdformat",
  "mdformat-config",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-pyproject",
  "mdformat-ruff",
  "mdformat-shfmt",
  "pyproject-fmt",
  "pyright",
  "ruff",
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-xdist>=3.2",
]

[tool.hatch]
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/sg_event_daemon" ]
build.targets.sdist.include = [
  "/docs/operations.md",
  "/docs/porting.md",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/src",
]

# Keep checkout links relative; package links target this release.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]\n]*\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://raw.githubusercontent.com/dactylo/sg-event-daemon/v$HFPR_VERSION/\2\3'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)(\[[^\]\n]+\]\()(?![A-Za-z][A-Za-z0-9+.-]*:|[/#])(?:\./)?([^\s)]+)(\))'
replacement = '\1https://github.com/dactylo/sg-event-daemon/blob/v$HFPR_VERSION/\2\3'

[tool.uv]
# CI supplies native Taplo; mdformat-config 0.2.1 otherwise pulls a Python Taplo wheel.
exclude-dependencies = [
  { package = { name = "mdformat-config", version = "0.2.1" }, dependencies = [ "taplo" ] },
]

# ==========================================================
# Ruff Configuration
# ==========================================================
[tool.ruff]
target-version = "py311"
line-length = 99
format.quote-style = "single"
format.exclude = [ "*.md" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # Conflicts with the Ruff formatter
  "CPY001", # Copyright notices are not required
  "EM101",  # Exception must not use string literal
  "EM102",  # Exception must not use f-string literal
  "FBT001", # Boolean positional arg in function definition
  "FBT002", # Boolean default value in function definition
  "Q000",   # Conflicts with the Ruff formatter
  "Q001",   # Conflicts with the Ruff formatter
  "Q003",   # Conflicts with the Ruff formatter
  "T201",   # print() found
  "TRY003", # Avoid specifying long messages outside exception class
]
lint.per-file-ignores."benchmarks/benchmark_state.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_config.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_control.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_fanout.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_group_recovery.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_group_state.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_ipc.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_lane.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_plugins.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_source.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_strict.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_supervisor.py" = [ "SLF001" ]
lint.per-file-ignores."src/sg_event_daemon/_worker.py" = [ "SLF001" ]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # No docstrings required in tests
  "PLR2004", # Allow magic values in tests
  "S101",    # Allow asserts in tests
  "S603",    # Allow subprocess calls in tests
  "S607",    # Allow partial executable paths in tests
  "SLF001",  # Tests intentionally inspect and patch private state
]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"

# ==========================================================
# Pyright Configuration
# ==========================================================
[tool.pyright]
pythonVersion = "3.11"  # Keep in sync with tool.ruff.target-version
typeCheckingMode = "strict"
extraPaths = [ ".", "src" ]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = "none" },
  { root = "." },
]

# ==========================================================
# Pytest Configuration
# ==========================================================
[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = [ "-q", "--strict-markers", "--tb=short" ]
ini_options.markers = [
  "live: external durability test requiring --run-live",
  "live_load: external bounded-load test requiring --run-live-load",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ==========================================================
# Mdformat Configuration (Requires mdformat-pyproject)
# ==========================================================
[tool.mdformat]
wrap = 99  # Keep in sync with tool.ruff.line-length
number = true
