name: Release

# Run manually after reviewing CI for the selected branch or tag.
# Configure the PyPI Trusted Publisher with release.yml and environment pypi.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify version tag and successful CI
        id: ci
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          tag = f"v{project['version']}"
          commit = os.environ['GITHUB_SHA']
          tagged = subprocess.run(
              ['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'],
              capture_output=True, text=True,
          )
          if tagged.returncode or tagged.stdout.strip() != commit:
              raise SystemExit(f'{tag} must point to the selected commit before publishing.')

          repository = os.environ['GITHUB_REPOSITORY']
          response = subprocess.check_output(
              [
                  'gh', 'api', '--method', 'GET',
                  f'repos/{repository}/actions/workflows/ci.yml/runs',
                  '-f', f'head_sha={commit}',
                  '-f', f"branch={os.environ['DEFAULT_BRANCH']}",
                  '-f', 'event=push', '-f', 'per_page=1',
              ],
              text=True,
          )
          runs = json.loads(response)['workflow_runs']
          if not runs:
              raise SystemExit('No push CI run exists for this release commit.')
          run = runs[0]
          if run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit(f"CI must pass before publishing: {run['html_url']}")
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"run-id={run['id']}\n")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f"Publishing {tag} from `{commit}`. [CI run]({run['html_url']}).\n")
          PY

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sg-event-daemon
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download CI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
          run-id: ${{ needs.verify.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
